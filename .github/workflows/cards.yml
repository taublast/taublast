name: Repo cards

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/scripts/cards.py

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the cards
        run: python .github/scripts/cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards README.md
          git diff --cached --quiet || (git commit -m "Repo cards: refreshed" && git push)
